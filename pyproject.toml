[project]
name = "ai-summary-of-url"
version = "0.1.0"
description = "Add your description here"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "crawlee[playwright]>=1.7.2",
    "fastapi>=0.136.3",
    "google-genai>=1.61.0",
    "mastodon-py>=2.2.1",
    "pyperclip>=1.11.0",
    "pytector>=0.3.2",
    "python-dotenv>=1.2.1",
    "texthumanize>=0.35.0",
    "uvicorn>=0.48.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
